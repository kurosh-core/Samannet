<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Config Cloud Panel</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span>Config Cloud</span></div>
    <div id="navList"></div>
    <div class="sidebar-footer">
      <div class="nav-item" data-nav="support"><span class="ic">?</span> Support</div>
      <div class="nav-item" id="logoutBtn"><span class="ic">⏻</span> خروج</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="search"><span>🔎</span><input placeholder="جستجو..." id="searchInput"></div>
      <div class="right">
        <div class="icon-btn" title="Notifications">🔔<span class="badge-dot" id="notifDot" style="display:none"></span></div>
        <div class="user-menu" id="userMenu"><div class="avatar" id="avatarInit">?</div><span id="userEmail">...</span></div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state">در حال بارگذاری...</div>
    </div>
  </div>
</div>

<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
